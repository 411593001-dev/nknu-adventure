<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>高師大冒險物語｜3D 校園</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Noto Sans TC",sans-serif;background:#b9dced;color:#203044}canvas{display:block;touch-action:none}#game{position:fixed;inset:0}.panel{background:#ffffffdf;backdrop-filter:blur(8px);border:1px solid #fff;border-radius:15px;box-shadow:0 6px 22px #1232}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}#brand,#stats{padding:10px 14px}#brand strong{display:block}#brand small{color:#607080}#stats{font-weight:700;white-space:nowrap}#task{position:fixed;top:95px;left:12px;padding:12px;width:min(255px,58vw)}#task p{font-size:13px;line-height:1.5;margin:5px 0 0}#hint{position:fixed;top:95px;left:50%;transform:translateX(-50%);padding:8px 12px;font-size:12px;text-align:center;max-width:88vw}#start{position:fixed;inset:0;display:grid;place-items:center;background:#d8edf6d9;z-index:5;padding:18px}#start .card{max-width:540px;text-align:center;padding:30px}h1{font-size:clamp(27px,5vw,42px);margin:0 0 10px}#start p{line-height:1.7;color:#536779}button{border:0;border-radius:12px;background:#287775;color:white;font-weight:800;padding:13px 19px;font-size:16px}#dialog{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(600px,calc(100vw - 24px));padding:16px}#dialog p{line-height:1.6}#interact{display:none;position:fixed;right:18px;bottom:25px}#controls{display:none;position:fixed;left:14px;bottom:15px;width:142px;height:142px;touch-action:none}.pad{position:absolute;width:44px;height:44px;display:grid;place-items:center;background:#fffE;border-radius:12px;border:1px solid #d5e0e8;font-size:20px;font-weight:800;user-select:none}.up{left:49px;top:0}.left{left:0;top:49px}.down{left:49px;top:49px}.right{left:98px;top:49px}#look{display:none;position:fixed;right:0;bottom:0;width:48vw;height:48vh;touch-action:none}#foot{position:fixed;bottom:7px;left:50%;transform:translateX(-50%);font-size:10px;color:white;text-shadow:0 1px 4px #123;white-space:nowrap;pointer-events:none}@media(pointer:coarse){#controls,#look{display:block}#hint{top:auto;bottom:165px}#task{top:90px;width:190px}#brand small{display:none}#stats{font-size:13px;padding:9px}}@media(max-width:430px){#hud{top:7px;left:7px;right:7px}#task{left:7px;top:78px;padding:9px}#hint{font-size:11px}}
</style></head><body><div id="game"></div>
<div id="start"><div class="card panel"><h1>高師大冒險物語</h1><p>探索陽光下的 3D 校園，走訪教學大樓、找同學聊天，收集 5 顆校園星星。<br>電腦用 WASD／方向鍵移動；滑鼠拖曳轉視角。手機使用左下方向鍵與右側滑動。</p><button id="go">開始冒險</button></div></div>
<div id="hud"><div id="brand" class="panel"><strong>高師大冒險物語</strong><small>NKNU · 3D Campus Explorer</small></div><div id="stats" class="panel">⭐ <span id="count">0</span>/5　📍 <span id="area">校園入口</span></div></div>
<div id="task" class="panel"><b>今日任務</b><p id="tasktext">探索校園，收集 5 顆星星，並和校園夥伴打招呼。</p></div><div id="hint" class="panel">WASD／方向鍵移動 · 拖曳轉視角 · 靠近人物按 E</div>
<button id="interact">💬 互動</button><div id="dialog" class="panel"><b id="dtitle">校園夥伴</b><p id="dtext"></p><button id="close">繼續探索</button></div>
<div id="controls"><div class="pad up" data-key="w">↑</div><div class="pad left" data-key="a">←</div><div class="pad down" data-key="s">↓</div><div class="pad right" data-key="d">→</div></div><div id="look"></div><div id="foot">3D 概念校園場景，非精準校園測繪</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb9dced);scene.fog=new THREE.Fog(0xb9dced,45,115);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.querySelector('#game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe9f7ff,0x728363,2));const sun=new THREE.DirectionalLight(0xffefcf,3);sun.position.set(-25,38,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-50;sun.shadow.camera.right=50;sun.shadow.camera.top=50;sun.shadow.camera.bottom=-50;scene.add(sun);
const M=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const grass=M(0x8ebc83),path=M(0xd7d1bf),wall=M(0xe9e7df),trim=M(0x8b9292),glass=M(0x7bb7cb,.3),wood=M(0x8d6849),leaf=M(0x54895b),leaf2=M(0x77a66a),dark=M(0x344a55);
function addBox(w,h,d,m,x,y,z,shadow=true){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}
function cyl(rt,rb,h,m,x,y,z){let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,10),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
addBox(180,.5,180,grass,0,-.35,0,false);addBox(8,.08,100,path,0,-.06,0,false);addBox(100,.08,7,path,0,-.05,3,false);addBox(28,.1,18,trim,0,-.02,-16,false);
function building(x,z,w,d,floors){let h=floors*3.15;addBox(w,h,d,wall,x,h/2,z);for(let f=0;f<floors;f++){let y=1+f*3.15;addBox(w+.15,.16,d+.15,trim,x,y,z);let n=Math.max(3,Math.floor(w/2.4));for(let j=0;j<n;j++){let xx=x-w/2+1.2+j*(w-2.4)/(n-1);addBox(.82,1.35,.09,glass,xx,y+1,z-d/2-.06,false);addBox(.9,.08,.12,dark,xx,y+.3,z-d/2-.04,false)}}addBox(w+.4,.32,d+.4,trim,x,h+.15,z);addBox(w*.27,.32,1.1,trim,x,.2,z-d/2-.65);addBox(w*.28,.16,1.1,wall,x,.08,z-d/2-1.1,false)}
building(-15,-28,19,10,3);building(15,-31,18,11,4);building(-28,-7,13,10,2);building(29,-8,15,11,3);building(-17,20,18,11,2);building(18,20,19,12,2);
function tree(x,z,s=1){cyl(.16*s,.24*s,1.8*s,wood,x,.8*s,z);for(let [dx,dy,dz,r] of [[0,2,0,1.2],[.45,2.35,.1,.8],[-.45,2.25,-.1,.7]]){let o=new THREE.Mesh(new THREE.IcosahedronGeometry(r*s,1),Math.random()>.5?leaf:leaf2);o.position.set(x+dx*s,dy*s,z+dz*s);o.castShadow=true;scene.add(o)}}
for(let z=-39;z<=39;z+=8){tree(-7,z,.85);tree(7,z,.85)}for(let x=-39;x<=39;x+=8){tree(x,9,.9);tree(x,-41,.9)}
for(let [x,z] of [[-5,-4],[5,-4],[-5,11],[5,11]]){addBox(1.8,.18,.5,wood,x,.55,z);addBox(1.8,.4,.12,wood,x,.8,z-.2);for(let dx of [-.6,.6])addBox(.12,.5,.12,dark,x+dx,.25,z)}
function person(shirt,skin=0xe2b18b){let root=new THREE.Group();scene.add(root);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.65,4,8),M(shirt));body.position.y=1.2;body.castShadow=true;root.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.3,14,12),M(skin));head.position.y=1.98;head.castShadow=true;root.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.32,12,8,0,Math.PI*2,0,Math.PI*.6),M(0x44362e));hair.position.set(0,2.08,-.02);root.add(hair);for(let x of [-.11,.11]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.03,8,8),M(0x172b35));eye.position.set(x,2,.27);root.add(eye)}let legs=[];for(let x of [-.17,.17]){let leg=new THREE.Mesh(new THREE.CapsuleGeometry(.105,.43,3,6),M(0x33445b));leg.position.set(x,.4,0);leg.castShadow=true;root.add(leg);legs.push(leg)}return {root,legs}}
const player=person(0x2e6b91);player.root.position.set(0,0,12);
const npcs=[{x:-5,z:-1,name:'小芸｜學伴',color:0xb66c53,msg:'嗨！歡迎來到高師大冒險物語。沿著中央步道探索，收集散落在校園裡的星星吧！'},{x:8,z:-17,name:'阿哲｜圖書館夥伴',color:0x6b8c54,msg:'圖書館是找資料和沉澱想法的好地方。別忘了欣賞校園風景！'},{x:-21,z:-4,name:'林老師',color:0x8b6ca8,msg:'探索也是一種學習。到不同的建築看看，和校園夥伴聊聊吧！'}].map(n=>({...n,p:person(n.color)}));npcs.forEach(n=>n.p.root.position.set(n.x,0,n.z));
const starMat=new THREE.MeshStandardMaterial({color:0xffcf4d,emissive:0x8d5700,emissiveIntensity:.5,metalness:.15,roughness:.3});
const stars=[[-4,-12],[4,-25],[-20,-15],[22,-15],[0,24]].map(([x,z],i)=>{let mesh=new THREE.Mesh(new THREE.OctahedronGeometry(.62),starMat);mesh.position.set(x,1,z);mesh.castShadow=true;scene.add(mesh);addBox(1.25,.08,1.25,M(0xe7d6a1),x,.04,z,false);return {mesh,x,z,got:false,i}});
let collected=0,started=false,dialog=false,near=null,yaw=0,pitch=.2,dist=7.5,drag=false,lx=0,ly=0,walk=0;const keys={};const target=new THREE.Vector3();
function show(title,text){document.querySelector('#dtitle').textContent=title;document.querySelector('#dtext').textContent=text;document.querySelector('#dialog').style.display='block';dialog=true}
function close(){dialog=false;document.querySelector('#dialog').style.display='none'}document.querySelector('#close').onclick=close;
function interact(){if(near){show(near.name,near.msg);return}let s=stars.find(a=>!a.got&&player.root.position.distanceTo(a.mesh.position)<2.5);if(s){s.got=true;scene.remove(s.mesh);collected++;document.querySelector('#count').textContent=collected;document.querySelector('#tasktext').textContent=collected===5?'任務完成！你收集了全部 5 顆星星！':`已收集 ${collected}/5 顆星星，繼續探索！`;show('星星收集成功！',collected===5?'太棒了！你完成今天的校園探索任務！':'收集到一顆校園星星，再找找其他星星吧。')}else show('探索提示','走近發光的星星或校園夥伴，再按 E 或點互動按鈕。')}
document.querySelector('#go').onclick=()=>{started=true;document.querySelector('#start').style.display='none'};
document.querySelector('#interact').onclick=interact;
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if(k==='e'&&!e.repeat&&started&&!dialog)interact();if(k==='escape')close()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){drag=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(drag&&e.pointerType==='mouse'){yaw-=(e.clientX-lx)*.006;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-ly)*.003,-.05,.65);lx=e.clientX;ly=e.clientY}});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
const look=document.querySelector('#look');let lt=null;look.addEventListener('pointerdown',e=>{lt={x:e.clientX,y:e.clientY};look.setPointerCapture(e.pointerId)});look.addEventListener('pointermove',e=>{if(lt){yaw-=(e.clientX-lt.x)*.009;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lt.y)*.004,-.05,.65);lt={x:e.clientX,y:e.clientY}}});look.addEventListener('pointerup',()=>lt=null);look.addEventListener('pointercancel',()=>lt=null);
document.querySelectorAll('.pad').forEach(el=>{let k=el.dataset.key;el.onpointerdown=e=>{e.preventDefault();keys[k]=true;el.setPointerCapture(e.pointerId)};let off=()=>keys[k]=false;el.onpointerup=off;el.onpointercancel=off;el.onlostpointercapture=off});
function update(dt,t){let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);if(started&&!dialog&&(f||s)){let v=new THREE.Vector3(s,0,-f).normalize(),c=Math.cos(yaw),sn=Math.sin(yaw),dx=v.x*c+v.z*sn,dz=-v.x*sn+v.z*c;player.root.position.x+=dx*6*dt;player.root.position.z+=dz*6*dt;player.root.rotation.y=Math.atan2(dx,dz);walk+=dt*10;player.legs.forEach((l,i)=>l.rotation.x=Math.sin(walk+i*Math.PI)*.6)}else player.legs.forEach(l=>l.rotation.x*=.75);
player.root.position.x=THREE.MathUtils.clamp(player.root.position.x,-48,48);player.root.position.z=THREE.MathUtils.clamp(player.root.position.z,-48,48);
target.set(player.root.position.x,1.35,player.root.position.z);let h=Math.cos(pitch)*dist;camera.position.set(target.x+Math.sin(yaw)*h,target.y+Math.sin(pitch)*dist+1.2,target.z+Math.cos(yaw)*h);camera.lookAt(target);
stars.forEach(a=>{if(!a.got){a.mesh.rotation.y=t*.9;a.mesh.position.y=1.05+Math.sin(t*2+a.i)*.18}});npcs.forEach(n=>n.p.root.rotation.y=Math.atan2(player.root.position.x-n.x,player.root.position.z-n.z));near=null;let nd=99;for(let n of npcs){let d=player.root.position.distanceTo(n.p.root.position);if(d<2.5&&d<nd){near=n;nd=d}}document.querySelector('#interact').style.display=started&&!dialog&&near?'block':'none';let x=player.root.position.x,z=player.root.position.z;document.querySelector('#area').textContent=Math.abs(z)<5?'中央步道':z<-20?'教學區':x<-18?'藝術教室區':x>18?'行政／交流區':'校園探索區'}
let prev=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-prev)/1000,.04);prev=now;update(dt,now/1000);renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
</script></body></html>
